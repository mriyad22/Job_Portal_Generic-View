{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobHub{% endblock %}</title>
  <meta name="description" content="Modern Django Job Portal">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#2563eb;--primary-dark:#1d4ed8;--ink:#0f172a;--muted:#64748b;--surface:#fff;--soft:#f8fafc;--border:#e2e8f0;--success:#16a34a}
    *{box-sizing:border-box} body{font-family:'Inter',sans-serif;background:#f8fafc;color:var(--ink);min-height:100vh}
    a{text-decoration:none}.page-wrap{min-height:calc(100vh - 72px)}
    .section{padding:52px 0}.hero{background:linear-gradient(135deg,#eff6ff 0%,#ffffff 55%,#eef2ff 100%);border-bottom:1px solid var(--border)}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .display-title{font-weight:800;letter-spacing:-.04em}.text-muted-custom{color:var(--muted)}
    .card-modern{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .btn-primary{background:var(--primary);border-color:var(--primary)}.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
    .btn-pill{border-radius:999px;padding:.65rem 1.15rem;font-weight:600}.form-control,.form-select{border-radius:12px;border-color:#cbd5e1;padding:.72rem .9rem}.form-control:focus,.form-select:focus{border-color:#93c5fd;box-shadow:0 0 0 .2rem rgba(37,99,235,.12)}
    .form-label{font-weight:600;font-size:.9rem}.field-help{font-size:.78rem;color:var(--muted)}
    .job-card{height:100%;transition:.25s;border:1px solid var(--border);border-radius:20px;background:#fff}.job-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(15,23,42,.1)}
    .company-logo{width:58px;height:58px;object-fit:cover;border-radius:15px;border:1px solid var(--border);background:#f1f5f9}.avatar{width:112px;height:112px;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 10px 30px rgba(15,23,42,.12);background:#e2e8f0}
    .badge-soft{background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe}.info-chip{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:.78rem;color:#475569}
    .auth-shell{min-height:calc(100vh - 72px);display:flex;align-items:center;background:radial-gradient(circle at top left,#dbeafe,transparent 35%),#f8fafc}.auth-card{max-width:520px;margin:auto}
    .footer{border-top:1px solid var(--border);background:#fff}.empty-state{padding:70px 20px;text-align:center;border:1px dashed #cbd5e1;border-radius:20px;background:#fff}
    .table-modern{border-collapse:separate;border-spacing:0}.table-modern th{background:#f8fafc;color:#475569;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}.table-modern th,.table-modern td{padding:16px;border-bottom:1px solid var(--border)}
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include 'master/nav.html' %}
  <main class="page-wrap">{% include 'message.html' %}{% block content %}{% endblock %}</main>
  <footer class="footer py-4"><div class="container d-flex flex-column flex-md-row justify-content-between gap-2"><span class="fw-semibold">JobHub</span><span class="text-muted-custom small">Built with Django & Bootstrap</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
